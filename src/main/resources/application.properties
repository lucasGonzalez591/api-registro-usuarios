# Base de datos H2 en memoria (se borra al apagar la app)
spring.datasource.url=jdbc:h2:mem:usersdb
spring.datasource.driver-class-name=org.h2.Driver

# "none": Hibernate NO crea las tablas, las crea nuestro schema.sql
spring.jpa.hibernate.ddl-auto=none

# Fuerza a Spring a ejecutar schema.sql al arrancar
spring.sql.init.mode=always
spring.sql.init.schema-location=classpath:schema.sql

# Habilita la consola web de H2 para ver los datos (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Email: texto@dominio.ext
app.validation.email-regex=^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$

# Password: mínimo 8 caracteres, al menos 1 mayúscula y 1 número
app.validation.password-regex=^(?=.*[A-Z])(?=.*\\d).{8,}$

